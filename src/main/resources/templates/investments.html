<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Investments — FinOS AI</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon">💰</div>
        <span class="sidebar-brand-name">FinOS AI</span>
    </div>
    <div class="sidebar-section-label">Main</div>
    <a href="/dashboard-page">📊 Dashboard</a>
    <a href="/income-page">💰 Income</a>
    <a href="/expenses-page">💸 Expenses</a>
    <a href="/budgets-page">📋 Budgets</a>
    <a href="/investments-page" class="active">📈 Investments</a>
    <a href="/savings-page">🎯 Savings Goals</a>
    <div class="sidebar-section-label" style="margin-top:12px;">Account</div>
    <a href="/profile-page">👤 Profile</a>
    <a href="/change-password-page">🔐 Change Password</a>
    <div class="sidebar-spacer"></div>
    <button class="sidebar-logout" onclick="logout()">⬅ Logout</button>
</div>

<div class="main-content">
    <div class="page-header">
        <div>
            <div class="page-title">Investments</div>
            <div class="page-subtitle">Monitor and grow your portfolio</div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">➕ Add / Edit Investment</div>
        <div class="form-grid">
            <div class="form-field">
                <label for="investmentType">Type</label>
                <input type="text" id="investmentType" placeholder="e.g. Mutual Fund">
            </div>
            <div class="form-field">
                <label for="investmentName">Name</label>
                <input type="text" id="investmentName" placeholder="e.g. Nifty 50 Index">
            </div>
            <div class="form-field">
                <label for="investedAmount">Invested Amount (₹)</label>
                <input type="number" id="investedAmount" placeholder="0.00">
            </div>
            <div class="form-field">
                <label for="currentValue">Current Value (₹)</label>
                <input type="number" id="currentValue" placeholder="0.00">
            </div>
            <div class="form-field" style="align-self:end;">
                <button class="btn btn-primary" onclick="saveInvestment()">Save Investment</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📋 Investment List</div>
        <table id="investmentTable">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Name</th>
                    <th>Invested Amount</th>
                    <th>Current Value</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="/js/investments.js"></script>
<script>
function logout() {
    localStorage.removeItem("token");
    window.location.href = "/";
}
</script>
</body>
</html>
