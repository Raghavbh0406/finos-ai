<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Budgets - FinOS AI</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="sidebar">

    <h2>FinOS AI</h2>

    <a href="/dashboard-page">Dashboard</a>
    <a href="/income-page">Income</a>
    <a href="/expenses-page">Expenses</a>
    <a href="/budgets-page">Budgets</a>
    <a href="/investments-page">Investments</a>
    <a href="/savings-page">Savings Goals</a>

</div>

<div class="main-content">

    <h1>Budgets</h1>

    <div class="card">

        <h3>Create Budget</h3>

        <br>

        <input
                id="category"
                type="text"
                placeholder="Category">

        <br><br>

        <input
                id="limitAmount"
                type="number"
                placeholder="Budget Amount">

        <br><br>

        <button onclick="createBudget()">
            Create Budget
        </button>

    </div>

    <br>

    <div class="card">

        <h3>Budget List</h3>

        <br>

        <table id="budgetTable">

            <thead>

            <tr>
                <th>Category</th>
                <th>Limit</th>
            </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<script th:src="@{/js/budgets.js}"></script>

</body>
</html>
