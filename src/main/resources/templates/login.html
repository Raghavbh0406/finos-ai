<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>FinOS AI Login</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <h1>FinOS AI</h1>

        <p class="subtitle">
            Smart Personal Finance Management
        </p>

        <form>

            <input
                    type="email"
                    placeholder="Enter Email"
                    required>

            <input
                    type="password"
                    placeholder="Enter Password"
                    required>

            <button type="submit">
                Login
            </button>
            <a href="/register">
                Create Account
            </a>

        </form>

    </div>

</div>

</body>
</html>
