<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Change Password - FinOS AI</title>

<link rel="stylesheet"
      href="/css/dashboard.css">

</head>

<body>

<div class="sidebar">

<h2>FinOS AI</h2>

<a href="/dashboard-page">📊 Dashboard</a>
<a href="/income-page">💰 Income</a>
<a href="/expenses-page">💸 Expenses</a>
<a href="/budgets-page">📋 Budgets</a>
<a href="/investments-page">📈 Investments</a>
<a href="/savings-page">🎯 Savings Goals</a>
<a href="/profile-page">👤 Profile</a>
<a href="/change-password-page">🔐 Change Password</a>

<br><br>

<button onclick="logout()">
    Logout
</button>

</div>

<div class="main-content">

<h1>Change Password</h1>

<div class="card">

    <h3>Update Password</h3>

    <br>

    <div style="position:relative;">

        <input
                id="oldPassword"
                type="password"
                placeholder="Current Password"
                style="width:100%;">

        <button
                type="button"
                onclick="toggleOldPassword()"
                style="
                    position:absolute;
                    right:10px;
                    top:50%;
                    transform:translateY(-50%);
                ">
            👁
        </button>

    </div>

    <br><br>

    <div style="position:relative;">

        <input
                id="newPassword"
                type="password"
                placeholder="New Password"
                style="width:100%;">

        <button
                type="button"
                onclick="toggleNewPassword()"
                style="
                    position:absolute;
                    right:10px;
                    top:50%;
                    transform:translateY(-50%);
                ">
            👁
        </button>

    </div>

    <br><br>

    <button onclick="changePassword()">
        Update Password
    </button>

    <br><br>

    <p id="message"></p>

</div>

</div>

<script src="/js/change-password.js"></script>

</body>
</html>
