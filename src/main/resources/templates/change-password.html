<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Change Password — FinOS AI</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<button class="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<div class="sidebar" id="sidebar">
    <div class="sidebar-brand"><div class="sidebar-brand-icon">💰</div><span class="sidebar-brand-name">FinOS AI</span></div>
    <div class="sidebar-section-label">Main</div>
    <a href="/dashboard-page">📊 Dashboard</a>
    <a href="/income-page">💰 Income</a>
    <a href="/expenses-page">💸 Expenses</a>
    <a href="/budgets-page">📋 Budgets</a>
    <a href="/investments-page">📈 Investments</a>
    <a href="/savings-page">🎯 Savings Goals</a>
    <a href="/subscriptions-page">📱 Subscriptions</a>
    <div class="sidebar-section-label" style="margin-top:12px;">Tools</div>
    <a href="/sip-calculator-page">📐 SIP Calculator</a>
    <a href="/loan-calculator-page">🏦 Loan / EMI</a>
    <a href="/tax-calculator-page">🧾 Tax Calculator</a>
    <a href="/retirement-calculator-page">👴 Retirement</a>
    <a href="/reports-page">📋 Reports</a>
    <a href="/forecast-page">🔮 Forecast</a>
    <div class="sidebar-section-label" style="margin-top:12px;">Account</div>
    <a href="/profile-page">👤 Profile</a>
    <a href="/change-password-page" class="active">🔐 Change Password</a>
    <div class="sidebar-spacer"></div>
    <button class="sidebar-logout" onclick="logout()">⬅ Logout</button>
</div>
<div class="main-content">
    <div class="page-header"><div><div class="page-title">Change Password</div><div class="page-subtitle">Keep your account secure</div></div></div>
    <div class="card" style="max-width:460px;">
        <div class="card-title">🔐 Update Password</div>
        <div id="errMsg" class="alert alert-error"></div>
        <div id="okMsg" class="alert alert-success"></div>
        <div class="form-field" style="margin-bottom:14px;">
            <label>Current Password</label>
            <div class="input-wrapper">
                <input type="password" id="oldPassword" placeholder="Enter current password">
                <button class="toggle-btn" type="button" onclick="toggleOldPassword()">👁</button>
            </div>
        </div>
        <div class="form-field" style="margin-bottom:20px;">
            <label>New Password</label>
            <div class="input-wrapper">
                <input type="password" id="newPassword" placeholder="Enter new password">
                <button class="toggle-btn" type="button" onclick="toggleNewPassword()">👁</button>
            </div>
        </div>
        <button class="btn btn-primary" style="width:100%;justify-content:center;" onclick="changePassword()">Update Password</button>
        <div id="message" style="display:none;"></div>
    </div>
</div>
<script src="/js/change-password.js"></script>
<script>
function toggleSidebar() {
    document.getElementById("sidebar").classList.toggle("open");
    document.getElementById("sidebarOverlay").classList.toggle("active");
}
function logout() { localStorage.removeItem("token"); window.location.href = "/"; }
</script>
</body>
</html>
