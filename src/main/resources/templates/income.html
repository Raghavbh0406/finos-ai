<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Income - FinOS AI</title>


<link rel="stylesheet"
      href="/css/dashboard.css">


</head>

<body>

<div class="sidebar">


<h2>FinOS AI</h2>

<a href="/dashboard-page">📊 Dashboard</a>
<a href="/income-page">💰 Income</a>
<a href="/expenses-page">💸 Expenses</a>
<a href="/budgets-page">📋 Budgets</a>
<a href="/investments-page">📈 Investments</a>
<a href="/savings-page">🎯 Savings Goals</a>
<a href="/profile-page">👤 Profile</a>

<br><br>

<button
        onclick="logout()"
        style="
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-weight:bold;
        ">
    Logout
</button>


</div>

<div class="main-content">


<h1>Income</h1>

<div class="card">

    <h3>Add / Edit Income</h3>

    <br>

    <input
            id="source"
            type="text"
            placeholder="Income Source">

    <br><br>

    <input
            id="amount"
            type="number"
            placeholder="Amount">

    <br><br>

    <input
            id="date"
            type="date">

    <br><br>

    <button onclick="addIncome()">
        Save Income
    </button>

</div>

<br>

<div class="card">

    <h3>Income List</h3>

    <br>

    <table id="incomeTable">

        <thead>
        <tr>
            <th>Source</th>
            <th>Amount</th>
            <th>Date</th>
            <th>Actions</th>
        </tr>
        </thead>

        <tbody>
        </tbody>

    </table>

</div>


</div>

<script src="/js/income.js"></script>

<script>
function logout() {

    localStorage.removeItem(
        "token"
    );

    window.location.href =
        "/";
}
</script>

</body>
</html>
