<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Savings Goals - FinOS AI</title>
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>

<body>

<div class="sidebar">

    <h2>FinOS AI</h2>

    <a href="/dashboard-page">Dashboard</a>
    <a href="/income-page">Income</a>
    <a href="/expenses-page">Expenses</a>
    <a href="/budgets-page">Budgets</a>
    <a href="/investments-page">Investments</a>
    <a href="/savings-page">Savings Goals</a>

</div>

<div class="main-content">

    <h1>Savings Goals</h1>

    <div class="card">

        <h3>Create Savings Goal</h3>

        <br>

        <input
                id="goalName"
                type="text"
                placeholder="Goal Name">

        <br><br>

        <input
                id="targetAmount"
                type="number"
                placeholder="Target Amount">

        <br><br>

        <input
                id="savedAmount"
                type="number"
                placeholder="Saved Amount">

        <br><br>

        <button onclick="createGoal()">
            Create Goal
        </button>

    </div>

    <br>

    <div class="card">

        <h3>My Savings Goals</h3>

        <br>

        <table id="goalTable">

            <thead>

            <tr>
                <th>Goal</th>
                <th>Target</th>
                <th>Saved</th>
                <th>Progress</th>
            </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>

<script th:src="@{/js/savings.js}"></script>

</body>
</html>
