<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Savings Goals — FinOS AI</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>

<div class="sidebar">
    <div class="sidebar-brand">
        <div class="sidebar-brand-icon">💰</div>
        <span class="sidebar-brand-name">FinOS AI</span>
    </div>
    <div class="sidebar-section-label">Main</div>
    <a href="/dashboard-page">📊 Dashboard</a>
    <a href="/income-page">💰 Income</a>
    <a href="/expenses-page">💸 Expenses</a>
    <a href="/budgets-page">📋 Budgets</a>
    <a href="/investments-page">📈 Investments</a>
    <a href="/savings-page" class="active">🎯 Savings Goals</a>
    <div class="sidebar-section-label" style="margin-top:12px;">Account</div>
    <a href="/profile-page">👤 Profile</a>
    <a href="/change-password-page">🔐 Change Password</a>
    <div class="sidebar-spacer"></div>
    <button class="sidebar-logout" onclick="logout()">⬅ Logout</button>
</div>

<div class="main-content">
    <div class="page-header">
        <div>
            <div class="page-title">Savings Goals</div>
            <div class="page-subtitle">Set targets and track your progress</div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">➕ Add / Edit Goal</div>
        <div class="form-grid">
            <div class="form-field">
                <label for="goalName">Goal Name</label>
                <input type="text" id="goalName" placeholder="e.g. Emergency Fund">
            </div>
            <div class="form-field">
                <label for="targetAmount">Target Amount (₹)</label>
                <input type="number" id="targetAmount" placeholder="0.00">
            </div>
            <div class="form-field">
                <label for="savedAmount">Saved So Far (₹)</label>
                <input type="number" id="savedAmount" placeholder="0.00">
            </div>
            <div class="form-field" style="align-self:end;">
                <button class="btn btn-primary" onclick="saveGoal()">Save Goal</button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📋 Savings Goals</div>
        <table id="goalTable">
            <thead>
                <tr>
                    <th>Goal Name</th>
                    <th>Target Amount</th>
                    <th>Saved Amount</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script src="/js/savings.js"></script>
<script>
function logout() {
    localStorage.removeItem("token");
    window.location.href = "/";
}
</script>
</body>
</html>
