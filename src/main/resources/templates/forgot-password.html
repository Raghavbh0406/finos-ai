<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Forgot Password - FinOS AI</title>
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="main-content">

    <h1>Forgot Password</h1>

    <div class="card" id="step1">
        <h3>Enter your email</h3>
        <br>
        <input id="email" type="email" placeholder="Enter your email">
        <br><br>
        <button onclick="getQuestion()">Continue</button>
        <br><br>
        <p id="message1"></p>
    </div>

    <div class="card" id="step2" style="display:none;">
        <h3>Answer your security question</h3>
        <br>
        <p id="questionText"></p>
        <br>
        <input id="answer" type="text" placeholder="Your answer">
        <br><br>
        <input id="newPassword" type="password" placeholder="New Password">
        <br><br>
        <button onclick="resetPassword()">Reset Password</button>
        <br><br>
        <p id="message2"></p>
    </div>

</div>

<script>
async function getQuestion() {
    const email = document.getElementById("email").value;
    const msg = document.getElementById("message1");

    try {
        const response = await fetch("/api/users/get-security-question", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email: email })
        });

        if (response.ok) {
            const question = await response.text();
            document.getElementById("questionText").innerText = question;
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
        } else {
            msg.innerText = "Email not found or no security question set.";
        }
    } catch (error) {
        msg.innerText = "Something went wrong.";
    }
}

async function resetPassword() {
    const email = document.getElementById("email").value;
    const answer = document.getElementById("answer").value;
    const newPassword = document.getElementById("newPassword").value;
    const msg = document.getElementById("message2");

    try {
        const response = await fetch("/api/users/reset-password-with-answer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, answer, newPassword })
        });

        if (response.ok) {
            msg.innerText = "Password reset successful! You can now login.";
            setTimeout(() => window.location.href = "/login-page", 2000);
        } else {
            msg.innerText = "Incorrect answer. Please try again.";
        }
    } catch (error) {
        msg.innerText = "Something went wrong.";
    }
}
</script>
</body>
</html>
